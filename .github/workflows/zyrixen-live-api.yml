name: Test Zyrixen Online API
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/zyrixen-live-api.yml'
permissions:
  contents: read
jobs:
  api-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Test public health and configuration
        env:
          API: https://hdlxgecizpuljvdoznyv.supabase.co/functions/v1/zyrixen-api
        run: |
          set -euo pipefail
          curl --fail-with-body -sS --max-time 25 "$API/health" | python3 -c 'import json,sys; assert json.load(sys.stdin)["ok"] is True'
          curl --fail-with-body -sS --max-time 25 "$API/config" | python3 -c 'import json,sys; a=json.load(sys.stdin); assert "enabled" in a and "maintenance" in a'
          curl --fail-with-body -sS --max-time 25 -X POST "$API/deobfuscate" -H 'Content-Type: application/json' --data '{"source":"print(123)"}' | python3 -c 'import json,sys; assert json.load(sys.stdin)["result"] == "print(123)"'
      - name: Exercise large source without old 600 KB cutoff
        env:
          API: https://hdlxgecizpuljvdoznyv.supabase.co/functions/v1/zyrixen-api
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          with open('/tmp/zyrixen-large.json','w') as f:
              json.dump({'source':'-- Zyrixen large source\\n' + ('local z=123\\n' * 65000)},f)
          PY
          curl --fail-with-body -sS --max-time 90 -X POST "$API/deobfuscate" -H 'Content-Type: application/json' --data-binary @/tmp/zyrixen-large.json -o /tmp/zyrixen-large-response.json
          python3 - <<'PY'
          import json
          with open('/tmp/zyrixen-large-response.json') as f: result=json.load(f)
          assert len(result['result']) > 600000, 'Large response was cut off'
          PY
      - name: Check unauthorized admin requests are rejected
        env:
          API: https://hdlxgecizpuljvdoznyv.supabase.co/functions/v1/zyrixen-api
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/owner-response -w '%{http_code}' --max-time 25 "$API/admin/stats")"
          test "$status" = 401
          status="$(curl -sS -o /tmp/owner-refresh-response -w '%{http_code}' --max-time 25 -X POST "$API/owner/refresh" -H 'Content-Type: application/json' --data '{"refresh_token":"not-a-real-token"}')"
          test "$status" = 401
