name: Test Zyrixen Online API
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/zyrixen-live-api.yml'
permissions:
  contents: read
jobs:
  api-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Test public health and configuration
        env:
          API: https://hdlxgecizpuljvdoznyv.supabase.co/functions/v1/zyrixen-api
        run: |
          set -euo pipefail
          curl --fail-with-body -sS --max-time 25 "$API/health" | python3 -c 'import json,sys; assert json.load(sys.stdin)["ok"] is True'
          curl --fail-with-body -sS --max-time 25 "$API/config" | python3 -c 'import json,sys; a=json.load(sys.stdin); assert "enabled" in a and "maintenance" in a'
          curl --fail-with-body -sS --max-time 25 "$API/health" | python3 -c 'import json,sys; a=json.load(sys.stdin); assert a["version"] == "1.1"; assert a["moonveil_v5"]["mode"] == "exact_input_analysis_cache"; assert a["moonveil_v5"]["arbitrary_source_supported"] is False'
      - name: Check unauthorized admin requests are rejected
        env:
          API: https://hdlxgecizpuljvdoznyv.supabase.co/functions/v1/zyrixen-api
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/no-user-response -w '%{http_code}' --max-time 25 -X POST "$API/deobfuscate" -H 'Content-Type: application/json' --data '{"source":"print(123)","request_id":"00000000-0000-4000-8000-000000000123"}')"
          test "$status" = 401
          status="$(curl -sS -o /tmp/owner-response -w '%{http_code}' --max-time 25 "$API/admin/stats")"
          test "$status" = 401
          status="$(curl -sS -o /tmp/owner-pair-response -w '%{http_code}' --max-time 25 -X POST "$API/owner/activate" -H 'Content-Type: application/json' --data '{"code":"invalid"}')"
          test "$status" = 401
          status="$(curl -sS -o /tmp/owner-refresh-response -w '%{http_code}' --max-time 25 -X POST "$API/owner/refresh" -H 'Content-Type: application/json' --data '{"refresh_token":"not-a-real-token"}')"
          test "$status" = 401
