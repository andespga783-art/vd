name: Test Zyrixen user registration
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/zyrixen-user-credit-test.yml'
permissions:
  contents: read
jobs:
  user-api:
    runs-on: ubuntu-latest
    steps:
      - name: Verify new-user registration and private endpoints
        env:
          API: https://hdlxgecizpuljvdoznyv.supabase.co/functions/v1/zyrixen-api
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          base=os.environ['API']
          username='ZyxQA'+os.environ['GITHUB_RUN_ID'][-12:]
          def call(path,method='GET',data=None,token=None):
              headers={'Content-Type':'application/json'}
              if token: headers['Authorization']='Bearer '+token
              body=json.dumps(data).encode() if data is not None else None
              request=urllib.request.Request(base+path,data=body,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(request,timeout=35) as response:
                      return response.status,json.load(response)
              except urllib.error.HTTPError as err:
                  return err.code,json.loads(err.read().decode())
          code,result=call('/user/register','POST',{'username':username})
          assert code==201,(code,result)
          assert result['user']['credits']==0 and not result['user']['unlimited']
          token=result['access_token']
          code,profile=call('/user/me',token=token)
          assert code==200 and profile['user']['username']==username
          assert profile['user']['credits']==0
          code,_=call('/user/register','POST',{'username':username.lower()})
          assert code==409,'Case-insensitive username not protected'
          code,_=call('/admin/users')
          assert code==401,'User listing unexpectedly public'
          code,_=call('/deobfuscate','POST',{'source':'print(1)','request_id':'00000000-0000-4000-8000-000000000008'})
          assert code==401,'Unauthenticated deobfuscation allowed'
          print('PASSED user registration, unique username, profile, admin access guard')
          print('Test user:',username)
          PY
