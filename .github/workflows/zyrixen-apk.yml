name: Build Zyrixen APKs
on:
  workflow_dispatch:
  push:
    paths:
      - 'zyrixen/**'
      - '.github/workflows/zyrixen-apk.yml'
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r zyrixen/backend/requirements.txt httpx\n      - run: python -m unittest discover -s zyrixen/backend -p 'test_*.py' -v
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle :deob:assembleDebug :owner:assembleDebug --no-daemon --stacktrace
        working-directory: zyrixen
      - name: Verify both installable APKs\n        run: |\n          set -euo pipefail\n          for module in deob owner; do\n            apk=\"zyrixen/$module/build/outputs/apk/debug/$module-debug.apk\"\n            test -s \"$apk\"\n            $ANDROID_HOME/build-tools/35.0.0/aapt dump badging \"$apk\" | sed -n "1,3p"\n          done\n      - uses: actions/upload-artifact@v4
        with:
          name: Zyrixen-Android-APKs
          path: |
            zyrixen/deob/build/outputs/apk/debug/*.apk
            zyrixen/owner/build/outputs/apk/debug/*.apk
          if-no-files-found: error
