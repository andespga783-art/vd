name: Build Zyrixen APKs

on:
  workflow_dispatch:
  push:
    paths:
      - 'zyrixen/**'
      - '.github/workflows/zyrixen-apk.yml'

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend test dependencies
        run: python -m pip install -r zyrixen/backend/requirements.txt httpx
      - name: Run backend unit tests
        run: python -m unittest discover -s zyrixen/backend -p 'test_*.py' -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build both APKs
        working-directory: zyrixen
        run: gradle :deob:assembleDebug :owner:assembleDebug --no-daemon --stacktrace
      - name: Verify APK outputs
        run: |
          set -euo pipefail
          for module in deob owner; do
            apk="zyrixen/$module/build/outputs/apk/debug/$module-debug.apk"
            test -s "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | sed -n '1,3p'
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Zyrixen-Android-APKs
          path: |
            zyrixen/deob/build/outputs/apk/debug/*.apk
            zyrixen/owner/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build permanently signed release APKs
        env:
          KEYSTORE_B64: ${{ secrets.ZYRIXEN_KEYSTORE_B64 }}
          ZYRIXEN_SIGNING_STORE_PASSWORD: ${{ secrets.ZYRIXEN_SIGNING_STORE_PASSWORD }}
          ZYRIXEN_SIGNING_KEY_ALIAS: ${{ secrets.ZYRIXEN_SIGNING_KEY_ALIAS }}
          ZYRIXEN_SIGNING_KEY_PASSWORD: ${{ secrets.ZYRIXEN_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "Release signing belum dikonfigurasi. Debug APK tetap dibuild untuk pengujian." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test -n "$ZYRIXEN_SIGNING_STORE_PASSWORD"
          test -n "$ZYRIXEN_SIGNING_KEY_ALIAS"
          test -n "$ZYRIXEN_SIGNING_KEY_PASSWORD"
          export ZYRIXEN_SIGNING_STORE_FILE="$RUNNER_TEMP/zyrixen-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ZYRIXEN_SIGNING_STORE_FILE"
          chmod 600 "$ZYRIXEN_SIGNING_STORE_FILE"
          (cd zyrixen && gradle :deob:assembleRelease :owner:assembleRelease --no-daemon --stacktrace)
          mkdir -p signed-apks
          cp zyrixen/deob/build/outputs/apk/release/deob-release.apk signed-apks/Zyrixen_Deobfuscator_v0.9.apk
          cp zyrixen/owner/build/outputs/apk/release/owner-release.apk signed-apks/Zyrixen_Owner_v0.9.apk
          for apk in signed-apks/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          done
          echo "Signed release APK v0.9 berhasil dibuat." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Zyrixen-v0.9-Signed-APKs
          path: signed-apks/*.apk
          if-no-files-found: ignore

  android16-install-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Zyrixen-Android-APKs
          path: downloaded-apks
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android 16 install and launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            set -e
            find downloaded-apks -name '*.apk' -print
            adb install -r downloaded-apks/deob/build/outputs/apk/debug/deob-debug.apk
            adb install -r downloaded-apks/owner/build/outputs/apk/debug/owner-debug.apk
            adb shell pm path com.zyrixen.deob
            adb shell pm path com.zyrixen.owner
            mkdir -p screenshots
            adb shell am start -n com.zyrixen.deob/.MainActivity
            sleep 4
            adb exec-out screencap -p > screenshots/deob.png
            adb shell am start -n com.zyrixen.owner/.MainActivity
            sleep 4
            adb exec-out screencap -p > screenshots/owner.png
            adb shell dumpsys activity activities | grep -E 'com.zyrixen.(deob|owner)' || true
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zyrixen-Screenshots
          path: screenshots/*.png
          if-no-files-found: ignore
