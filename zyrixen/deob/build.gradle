plugins { id 'com.android.application' }
android {
    namespace 'com.zyrixen.deob'
    compileSdk 35
    defaultConfig {
        applicationId 'com.zyrixen.deob'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3'
        def endpoint = System.getenv('ZYRIXEN_BACKEND_URL') ?: ''
        buildConfigField 'String', 'BACKEND_URL', "\""+endpoint+"\""
    }
    buildFeatures { buildConfig true }
}
